name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26'}
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -short ./...
