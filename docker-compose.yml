services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: martech
      POSTGRES_PASSWORD: martech
      POSTGRES_DB: martech
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martech"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["/app/api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://martech:martech@postgres:5432/martech?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: ["/app/worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://martech:martech@postgres:5432/martech?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      replicas: 2

volumes:
  pgdata:
